; Zombie Empire launcher settings (ZombieEmpire.exe)
; instance = folder inside instances\
instance=ZombieEmpire
; server = official server (host or host:port). If it answers you join it, otherwise you play singleplayer. Empty = always singleplayer
server=zombieempire.serveminecraft.net
; world = singleplayer world (folder inside saves\)
world=bossworld
; hub = where the player is moved on every singleplayer launch: x,y,z,yaw,pitch  (spawn = world spawn, off = don't move)
hub=25006.497,41,2725.620,-178.656,16.5
; gamemode = singleplayer and LAN game mode: adventure, survival, creative, spectator, off
gamemode=adventure
; lanport = port of the automatic LAN in singleplayer (off = don't open LAN)
lanport=25565
; music = Zombie Empire soundtrack in menu and game (on / off; volume = Minecraft "Music" slider)
music=on
; Title shown the first time on a PC (§ = Minecraft colors, e.g. §4 dark red, §l bold)
welcome_title=§4§lWelcome to Zombie Empire
welcome_subtitle=
